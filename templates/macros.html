{% macro title(value) %}
    <h1>{{value}} page</h1>


{% endmacro %}

{% macro input_field(name,type='text',placeholder='') %}

<label for="{{name}}">{{name}}</label>
<input type="{{type}}" name="{{name}}" id="{{name}}" placeholder="{{placeholder}}">

<br><br>
{% endmacro %}

{% macro card(name, role) %}

<div class="card">
    <h2>Name: {{name}}</h2>
    <h2>Role: {{role}}</h2>

    <div>
        <h1>Projects</h1>
        {{caller()}}
    </div>
</div>

{% endmacro %}
